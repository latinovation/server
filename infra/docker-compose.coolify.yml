# EVC Team Relay para Latinovation — Despliegue en Coolify (VPS).
# Coolify se encarga del Reverse Proxy (Traefik), la emisión automática de certificados SSL (Let's Encrypt)
# y el enrutamiento de WebSockets. Por eso, este stack no necesita el contenedor de Caddy.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-relay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-relay}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relay} -d ${POSTGRES_DB:-relay}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-relay}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-relay} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/relay &&
      mc anonymous set none local/relay
      "
    restart: "no"

  control-plane-migrate:
    image: ghcr.io/entire-vc/evc-team-relay/control-plane:${CP_VERSION:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"

  control-plane:
    image: ghcr.io/entire-vc/evc-team-relay/control-plane:${CP_VERSION:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL}
      RELAY_AUDIENCE: ${RELAY_AUDIENCE}
      RELAY_PRIVATE_KEY: ${RELAY_PRIVATE_KEY}
      RELAY_KEY_ID: ${RELAY_KEY_ID:-relay_cp_prod}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      SERVER_NAME: "${SERVER_NAME:-Latinovation Org}"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-relay}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: relay
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - uploads-data:/app/app/static/uploads
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      control-plane-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys,urllib.error,urllib.request\ntry:\n    sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready').status == 200 else 1)\nexcept urllib.error.HTTPError:\n    sys.exit(1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.control-plane.rule=Host(`${CP_DOMAIN}`)"
      - "traefik.http.routers.control-plane.entrypoints=https"
      - "traefik.http.routers.control-plane.tls=true"
      - "traefik.http.routers.control-plane.tls.certresolver=letsencrypt"
      - "traefik.http.services.control-plane.loadbalancer.server.port=8000"
    networks:
      - default
      - coolify

  relay-server:
    image: ghcr.io/entire-vc/evc-relay-server:${RELAY_VERSION:-0.9.12}
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - relay-data:/app/data
    configs:
      - source: relay_config
        target: /app/relay.toml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.relay-server.rule=Host(`${RELAY_DOMAIN}`)"
      - "traefik.http.routers.relay-server.entrypoints=https"
      - "traefik.http.routers.relay-server.tls=true"
      - "traefik.http.routers.relay-server.tls.certresolver=letsencrypt"
      - "traefik.http.services.relay-server.loadbalancer.server.port=8080"
    networks:
      - default
      - coolify

volumes:
  postgres-data:
  minio-data:
  uploads-data:
  relay-data:

configs:
  relay_config:
    content: |
      [server]
      url = "${RELAY_AUDIENCE}"
      host = "0.0.0.0"
      port = 8080

      [metrics]
      port = 9090

      [logging]
      level = "info"
      format = "pretty"

      [[auth]]
      key_id = "${RELAY_KEY_ID:-relay_cp_prod}"
      public_key = "${RELAY_PUBLIC_KEY}"

      [store]
      type = "minio"
      bucket = "relay"
      endpoint = "http://minio:9000"
      access_key = "${MINIO_ROOT_USER:-relay}"
      secret_key = "${MINIO_ROOT_PASSWORD}"
      prefix = ""

networks:
  default:
  coolify:
    external: true
