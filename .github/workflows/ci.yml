name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - name: Check contra vault-template
        run: |
          mkdir -p /tmp/vault && cp -R vault-template/Org /tmp/vault/Org
          ORG_VAULT_PATH=/tmp/vault ORG_VAULT_PERSON=ci ORG_VAULT_INDEX_DB=/tmp/org-vault-index.db \
            node mcp-org-vault/dist/index.js --check
